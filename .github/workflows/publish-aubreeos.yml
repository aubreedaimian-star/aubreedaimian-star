name: Publish AubreeOS Research Portfolio
on:
  push:
    branches: [main]
    paths:
      - 'aubreeos/**'
      - '.github/workflows/publish-aubreeos.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure and enable Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload AubreeOS site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./aubreeos
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
