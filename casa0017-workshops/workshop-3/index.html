<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Live MQTT messages from the UCL Connected Environments Lab.">
  <title>Signal Room | CASA0017 Workshop 3</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to messages</a>
  <nav class="navbar navbar-dark fixed-top" aria-label="Application status">
    <div class="container-fluid app-nav">
      <a class="navbar-brand" href="#main">Signal Room <span>/ 90TCR</span></a>
      <div class="connection" aria-label="MQTT connection status">
        <span id="connectionIndicator" class="connection-indicator is-disconnected" aria-hidden="true"></span>
        <span id="connectionStatus" aria-live="polite">Disconnected</span>
      </div>
    </div>
  </nav>

  <main class="container" id="main">
    <header class="page-header">
      <p class="eyebrow">CASA0017 · Workshop 03</p>
      <h1>Messages moving through the building.</h1>
      <p class="lead">A live view of the <code>UCL/90TCR</code> MQTT topic from the Connected Environments Lab.</p>
    </header>

    <section aria-labelledby="feed-title">
      <div class="feed-heading">
        <h2 id="feed-title">Live feed</h2>
        <p>Newest message first · up to 100 retained</p>
      </div>
      <div id="messageContainer" role="feed" aria-live="polite" aria-busy="false">
        <div class="empty-state" data-empty-state role="status">
          <span class="empty-pulse" aria-hidden="true"></span>
          <p>Waiting for the first message.</p>
        </div>
      </div>
    </section>
  </main>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://unpkg.com/mqtt@4.2.1/dist/mqtt.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
